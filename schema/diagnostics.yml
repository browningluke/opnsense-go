---
name: diagnostics
reconfigureEndpoint: "" # Controller-wide reconfigure endpoint (can be overwritten)
resources:
  # diagnostics resources

  - name: Interface
    filename: interface
    readOnly: true
    endpoints:
      get: "/diagnostics/interface/getInterfaceConfig"
    getByFilter: true
    getAll: true
    attrs:
      - name: Device
        type: string
        key: device
      - name: Media
        type: string
        key: media
      - name: MediaRaw
        type: string
        key: media_raw
      - name: MacAddr
        type: string
        key: macaddr
      - name: IsPhysical
        type: bool
        key: is_physical
      - name: MTU
        type: string
        key: mtu
      - name: Status
        type: string
        key: status
      - name: Flags
        type: "[]string"
        key: flags
      - name: Capabilities
        type: "[]string"
        key: capabilities
      - name: Options
        type: "[]string"
        key: options
      - name: SupportedMedia
        type: "[]string"
        key: supported_media
      - name: Groups
        type: "[]string"
        key: groups
      - name: Ipv4
        type: "[]Ipv4Config"
        key: ipv4
      - name: Ipv6
        type: "[]Ipv6Config"
        key: ipv6
    customTypes:
      Ipv4Config:
        - name: IpAddr
          type: string
          key: ipaddr
        - name: SubnetBits
          type: int64
          key: subnetbits
        - name: Tunnel
          type: bool
          key: tunnel
      Ipv6Config:
        - name: IpAddr
          type: string
          key: ipaddr
        - name: SubnetBits
          type: int64
          key: subnetbits
        - name: Tunnel
          type: bool
          key: tunnel
        - name: Autoconf
          type: bool
          key: autoconf
        - name: Deprecated
          type: bool
          key: deprecated
        - name: LinkLocal
          type: bool
          key: "link-local"
        - name: Tentative
          type: bool
          key: tentative

rpc:
  - name: "Netflow"
    filename: netflow
    customTypes:
      NetflowMonad:
        - name: Netflow
          type: Netflow
          key: netflow
      Netflow:
        - name: Capture
          type: Capture
          key: capture
        - name: Collect
          type: Collect
          key: collect
        - name: ActiveTimeout
          type: string
          key: activeTimeout
        - name: InactiveTimeout
          type: string
          key: inactiveTimeout
      Capture:
        - name: Interfaces
          type: SelectedMapList
          key: interfaces
        - name: EgressOnly
          type: SelectedMapList
          key: egress_only
        - name: Version
          type: SelectedMap
          key: version
        - name: Targets
          type: SelectedMapList
          key: targets
      Collect:
        - name: Enable
          type: string
          key: enable
      Result:
        - name: Result
          type: string
          key: result
      ActionResult:
        - name: Status
          type: string
          key: status
      IsEnabledResult:
        - name: Netflow
          type: int64
          key: netflow
        - name: Local
          type: int64
          key: local
      StatusResult:
        - name: Status
          type: string
          key: status
        - name: Collectors
          type: string
          key: collectors
          omitEmpty: true
      CacheStat:
        - name: Pkts
          type: int64
          key: Pkts
        - name: If
          type: string
          key: if
        - name: SrcIPAddresses
          type: int64
          key: SrcIPaddresses
        - name: DstIPAddresses
          type: int64
          key: DstIPaddresses
    rpc_calls:
      - name: "GetConfig"
        method: "GET"
        endpoint: "/diagnostics/netflow/getconfig"
        result_type: "NetflowMonad"
      - name: "SetConfig"
        method: "POST"
        endpoint: "/diagnostics/netflow/setconfig"
        params:
          - name: "netflow"
            optional: false
            bodyParameter: true
            customType: "Netflow"
        result_type: "Result"
      - name: "Reconfigure"
        method: "POST"
        endpoint: "/diagnostics/netflow/reconfigure"
        result_type: "ActionResult"
      - name: "IsEnabled"
        method: "GET"
        endpoint: "/diagnostics/netflow/is_enabled"
        result_type: "IsEnabledResult"
      - name: "Status"
        method: "GET"
        endpoint: "/diagnostics/netflow/status"
        result_type: "StatusResult"
      - name: "CacheStats"
        method: "GET"
        endpoint: "/diagnostics/netflow/cache_stats"
        # CacheStats (plural) is a hand-written map[string]CacheStat wrapper in
        # cache_stats.go, not a generated customType. The API returns "[]" when
        # empty and a map keyed by interface when populated.
        result_type: "CacheStats"
